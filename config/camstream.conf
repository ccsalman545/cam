# camstream configuration
#
# Copy to /etc/camstream.conf and start the server with:
#   camstream --config /etc/camstream.conf
#
# Every key is also a command line option; command line values win over
# this file. Keys left out keep their default. An unknown key or a value
# out of range makes the server refuse to start, so a typo is never
# silently ignored.

# Capture source: csi, v4l2, stdin or test.
#   csi   Raspberry Pi CSI camera (IMX219, IMX477, IMX708 ...) through
#         rpicam-vid/libcamera. Use this for every libcamera sensor: its
#         /dev/video0 is the raw sensor node and cannot deliver YUYV.
#   v4l2  USB (UVC) webcams and other devices that output YUYV/YU12.
source = csi
# V4L2 device used when source = v4l2.
device = /dev/video0
# rpicam-vid (or libcamera-vid) binary used when source = csi. Leave the key
# out to autodetect; an empty value is refused, like every other bad value.
# rpicam_bin = /usr/bin/rpicam-vid

# Frame geometry. With source = csi, libcamera scales the sensor mode to
# this size; widths that are a multiple of 64 (640, 1280, 1920) avoid a
# de-padding copy. With source = v4l2 the closest size the driver supports
# is used and reported in the log.
width = 1280
height = 720
fps = 30

# Encoder: auto (hardware first, libx264 fallback), hw, hw:/dev/video11, sw.
# Pi 4 and older have the bcm2835 hardware encoder (/dev/video11); the Pi 5
# has none, so auto uses libx264 there.
encoder = auto
bitrate_kbps = 2500
# Seconds between IDR frames. Shorter means faster recovery for a viewer
# that joins or loses packets, at the cost of bitrate.
keyframe_seconds = 2

# HTTP address for the web interface, signaling and diagnostics.
listen = 0.0.0.0
http_port = 8080

# First UDP port of the WebRTC media range, one port per viewer.
udp_port = 50000

# Multicast DNS: publish mdns_name.local so a browser on the same LAN needs
# no address. The responder announces on every interface and re-announces
# when one appears, so a cable plugged in later is picked up without a
# restart. See the "Automatic LAN connection" section of README.md.
mdns = on
# The label published as <mdns_name>.local. Letters, digits and '-' only,
# up to 63 characters. Two cameras on one LAN need different names, otherwise
# the second one moves to camstream-2 and says so in the log.
mdns_name = camstream
# UDP port of the responder. Leave at 5353; change it only when something
# else on the same host must not see these packets, such as a test.
mdns_port = 5353

# 1 writes DEBUG level messages to stderr as well as to /api/logs.
verbose = 0
