<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camstream</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1d2126;
    --line: #2c3238;
    --text: #e6e9ec;
    --muted: #9aa4ae;
    --ok: #46b17b;
    --warn: #d9a441;
    --bad: #d1605b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  #state-text { color: var(--muted); }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .video-wrap {
    background: #000;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  video { display: block; width: 100%; max-height: 70vh; background: #000; }
  .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin: 12px 0 16px;
  }
  button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: #3d464e; }
  button:disabled { color: var(--muted); cursor: default; }
  button.primary { background: #2a5f8f; border-color: #2a5f8f; }
  section { margin-bottom: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .cell {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 8px 10px;
  }
  .cell .k { color: var(--muted); font-size: 12px; }
  .cell .v { font-variant-numeric: tabular-nums; margin-top: 2px; }
  pre {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 10px; margin: 0;
    max-height: 260px; overflow: auto;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
  }
  .log-error { color: var(--bad); }
  .log-warn { color: var(--warn); }
  .log-info { color: var(--text); }
  .log-debug { color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; padding: 0 16px 20px; max-width: 1100px; margin: 0 auto; }
  footer code { color: var(--text); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { color: var(--muted); }
  select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px;
    font: inherit;
  }
</style>
</head>
<body>
<header>
  <span id="state-dot" class="dot"></span>
  <h1>camstream</h1>
  <span id="state-text">idle</span>
</header>

<main>
  <div class="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="placeholder" class="placeholder">not connected</div>
  </div>

  <div class="controls">
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <button id="restart-camera">Restart camera</button>
    <button id="restart-webrtc">Restart WebRTC</button>
    <button id="reload-config">Reload config</button>
  </div>

  <section>
    <h2>Stream</h2>
    <div class="grid" id="stream-grid"></div>
  </section>

  <section>
    <h2>Camera and encoder</h2>
    <div class="grid" id="camera-grid"></div>
  </section>

  <section>
    <h2>Transport counters</h2>
    <div class="grid" id="transport-grid"></div>
  </section>

  <section>
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <h2 style="margin: 0;">Server log</h2>
      <div class="row">
        <label for="log-level">level</label>
        <select id="log-level">
          <option value="debug">debug</option>
          <option value="info" selected>info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
        </select>
      </div>
    </div>
    <pre id="log">loading...</pre>
  </section>
</main>

<footer>
  Interfaces: <span id="interfaces">-</span>.
  Media flows over UDP ports <span id="udp-range">-</span>, signaling and these
  panels over HTTP port <span id="http-port">-</span>.
  Name for other devices: <span id="mdns-name">-</span>.
  The server must be on the same LAN as this browser: no STUN, no TURN, no relay.
</footer>

<script>
"use strict";

var state = {
  pc: null,
  sessionId: null,
  connecting: false,
  retried: false,
  lastStats: null,
  /* Auto connect on load, and how many attempts are left. A manual
     disconnect stops it; a successful stream resets it. */
  autoConnect: true,
  autoRetries: 0
};

var AUTO_RETRY_LIMIT = 5;

var el = function (id) { return document.getElementById(id); };

function setState(text, level) {
  el("state-text").textContent = text;
  el("state-dot").className = "dot" + (level ? " " + level : "");
}

function cell(key, value) {
  return '<div class="cell"><div class="k">' + key +
         '</div><div class="v">' + value + "</div></div>";
}

function num(value) {
  return (typeof value === "number") ? value.toLocaleString() : String(value);
}

function getJson(path) {
  return fetch(path, { cache: "no-store" }).then(function (response) {
    if (!response.ok) {
      throw new Error(path + ": HTTP " + response.status);
    }
    return response.json();
  });
}

function postJson(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function (response) {
    return response.json().catch(function () { return {}; }).then(function (data) {
      if (!response.ok) {
        throw new Error(data.error || (path + ": HTTP " + response.status));
      }
      return data;
    });
  });
}

/* --- connection ---------------------------------------------------- */

function connect() {
  if (state.connecting || state.pc) {
    return;
  }

  state.connecting = true;
  state.retried = false;
  setState("connecting", "warn");
  el("connect").disabled = true;
  el("placeholder").textContent = "connecting...";

  var pc = new RTCPeerConnection({ iceServers: [] });

  state.pc = pc;

  pc.addTransceiver("video", { direction: "recvonly" });

  pc.ontrack = function (event) {
    el("video").srcObject = event.streams[0];
    el("placeholder").style.display = "none";
    /*
     * The video element is muted, which is what browsers require before
     * they allow a stream to start without a click. If a policy still
     * refuses, the stream is running and only playback needs a gesture,
     * so say that instead of showing a stalled picture.
     */
    el("video").play().catch(function () {
      setState("stream ready, press Connect to start playback", "warn");
    });
    el("disconnect").disabled = false;
    state.autoRetries = 0;
    setState("streaming", "ok");
  };

  pc.oniceconnectionstatechange = function () {
    var s = pc.iceConnectionState;

    if (s === "failed") {
      setState("ICE failed, retrying", "bad");
      teardown(250);
    } else if (s === "disconnected") {
      setState("ICE disconnected", "warn");
    } else if (s === "connected" || s === "completed") {
      setState("connected", "ok");
    }
  };

  pc.createOffer({ offerToReceiveVideo: true })
    .then(function (offer) { return pc.setLocalDescription(offer); })
    .then(function () {
      return postJson("/api/webrtc/offer", { sdp: pc.localDescription.sdp });
    })
    .then(function (answer) {
      state.sessionId = answer.session_id;
      state.connecting = false;
      return pc.setRemoteDescription({ type: "answer", sdp: answer.sdp });
    })
    .catch(function (error) {
      state.connecting = false;
      setState("signaling failed: " + error.message, "bad");
      teardown(1000);
    });
}

function teardown(delayMs) {
  var pc = state.pc;
  var sessionId = state.sessionId;

  state.pc = null;
  state.sessionId = null;
  state.connecting = false;

  if (pc) {
    pc.getSenders().forEach(function () {});
    pc.close();
  }

  el("video").srcObject = null;
  el("placeholder").style.display = "flex";
  el("placeholder").textContent = "not connected";
  el("connect").disabled = false;
  el("disconnect").disabled = true;
  setState("idle");

  if (sessionId !== null) {
    postJson("/api/webrtc/close", { session_id: sessionId }).catch(function () {});
  }

  /*
   * One automatic retry covers a camera or network blip. After that the
   * retries are bounded so a server that stays down is not hammered,
   * and the operator decides when to try again.
   */
  if (delayMs && !state.retried) {
    state.retried = true;
    window.setTimeout(connect, delayMs);
  } else if (state.autoConnect && state.autoRetries < AUTO_RETRY_LIMIT) {
    state.autoRetries++;
    setState("reconnecting (" + state.autoRetries + "/" + AUTO_RETRY_LIMIT +
             ")", "warn");
    window.setTimeout(connect, Math.min(1000 * state.autoRetries, 5000));
  }
}

/* --- status and stats ---------------------------------------------- */

function refreshStatus() {
  return getJson("/api/status").then(function (status) {
    var encoder = status.encoder || {};
    var source = status.source || {};
    var webrtc = status.webrtc || {};
    var process_ = status.process || {};
    var media = status.media || {};

    el("stream-grid").innerHTML =
      cell("state", status.state) +
      cell("transport", webrtc.transport || "-") +
      cell("DTLS", webrtc.dtls || "-") +
      cell("viewers", num(webrtc.sessions_active) + " / " + num(webrtc.sessions_max)) +
      cell("codec", encoder.name || "-") +
      cell("resolution", (source.width || 0) + "x" + (source.height || 0)) +
      cell("capture fps", media.capture_fps.toFixed(1)) +
      cell("encode fps", media.encode_fps.toFixed(1)) +
      cell("bitrate", media.bitrate_kbps.toFixed(0) + " kbps") +
      cell("RSS", num(process_.rss_kb) + " kB") +
      cell("CPU", process_.cpu_percent.toFixed(1) + " %") +
      cell("uptime", num(status.uptime_sec) + " s");

    el("camera-grid").innerHTML =
      cell("source", source.name || source.kind || "-") +
      cell("source status", source.status || "-") +
      cell("frames", num(source.frames)) +
      cell("capture errors", num(source.capture_errors)) +
      cell("encoder", encoder.preference || "-") +
      cell("encoder status", encoder.status || "-") +
      cell("target bitrate", num(encoder.bitrate_kbps) + " kbps") +
      cell("frames encoded", num(encoder.frames)) +
      cell("keyframe every", num(encoder.keyframe_seconds) + " s") +
      cell("dropped AUs", num(media.au_dropped)) +
      cell("idle frames", num(media.skipped_idle)) +
      cell("errors logged", num(process_.log_errors));

    el("interfaces").textContent = (status.interfaces || []).map(function (i) {
      return i.ip + " (" + i.name + ")";
    }).join(", ") || "none";

    el("http-port").textContent = status.http.port;

    var mdns = status.mdns || {};

    el("mdns-name").textContent =
      mdns.enabled && mdns.url ? mdns.url : "off";
    el("udp-range").textContent = status.webrtc.udp_base_port + " to " +
      (status.webrtc.udp_base_port + status.webrtc.sessions_max - 1);

    if (status.last_error) {
      setState(status.state + ": " + status.last_error, "bad");
    } else if (!state.pc) {
      setState(status.state);
    }
  }).catch(function (error) {
    setState("server unreachable: " + error.message, "bad");
  });
}

function refreshStats() {
  return getJson("/api/stats").then(function (stats) {
    var rtp = stats.rtp || {};
    var dtls = stats.dtls || {};
    var session = (stats.sessions && stats.sessions.length) ? stats.sessions[0] : null;
    var video = el("video");

    el("transport-grid").innerHTML =
      cell("video size", (video.videoWidth || 0) + "x" + (video.videoHeight || 0)) +
      cell("client state", session ? session.state : "-") +
      cell("peer", session ? (session.peer || "-") : "-") +
      cell("RTT", session && session.rtt_ms >= 0 ? session.rtt_ms + " ms" : "-") +
      cell("packets sent", num(rtp.packets_sent)) +
      cell("bytes sent", num(rtp.bytes_sent)) +
      cell("NACKs", num(rtp.nacks_received)) +
      cell("PLIs", num(rtp.pli_received)) +
      cell("retransmits", num(rtp.retransmissions)) +
      cell("send errors", num(rtp.send_errors)) +
      cell("loss (last RR)", session ? (session.fraction_lost / 256 * 100).toFixed(1) + " %" : "-") +
      cell("handshakes", num(dtls.handshakes_completed) + " / " + num(dtls.handshake_failures) + " failed");
  });
}

function refreshLogs() {
  var level = el("log-level").value;

  return getJson("/api/logs?limit=120&level=" + level).then(function (data) {
    el("log").innerHTML = (data.entries || []).map(function (entry) {
      var stamp = (entry.uptime_ms / 1000).toFixed(1);
      return '<span class="log-' + entry.level + '">[' + stamp + "s] " +
             entry.level + " " + entry.tag + ": " + escapeHtml(entry.msg) + "</span>";
    }).join("\n") || "no entries at this level";
    el("log").scrollTop = el("log").scrollHeight;
  }).catch(function (error) {
    el("log").textContent = "logs unavailable: " + error.message;
  });
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function reportError(error) {
  setState(error.message, "bad");
  refreshLogs();
}

/* --- controls ------------------------------------------------------ */

el("connect").addEventListener("click", function () {
  state.autoConnect = true;
  state.autoRetries = 0;
  connect();
});

el("disconnect").addEventListener("click", function () {
  state.autoConnect = false;
  teardown(0);
});
el("log-level").addEventListener("change", refreshLogs);

el("restart-camera").addEventListener("click", function () {
  postJson("/api/camera/restart").then(function (data) {
    setState("camera restarted: " + data.encoder, "ok");
    if (state.autoConnect && !state.pc) {
      connect();
    }
  }).catch(reportError);
});

el("restart-webrtc").addEventListener("click", function () {
  teardown(0);
  postJson("/api/webrtc/restart").then(function (data) {
    setState("WebRTC restarted, new fingerprint " +
             (data.fingerprint || "?").slice(0, 24) + "...", "ok");
  }).catch(reportError);
});

el("reload-config").addEventListener("click", function () {
  postJson("/api/config/reload").then(function (data) {
    var applied = (data.applied || []).join(", ") || "nothing";
    var restart = (data.restart_required || []).join(", ");

    setState("config applied: " + applied +
             (restart ? "; restart required for: " + restart : ""), "ok");
  }).catch(reportError);
});

window.addEventListener("pagehide", function () { teardown(0); });

/*
 * A page that is opened is a page that wants video: connecting on load
 * is what makes "plug in the cable, open the address" a single step.
 * The connect is skipped for a page loaded from the file system, where
 * /api/ callbacks would fail anyway.
 */
if (location.protocol === "http:" || location.protocol === "https:") {
  connect();
} else {
  setState("open this page from the server address");
}

refreshStatus();
refreshStats();
refreshLogs();
window.setInterval(refreshStatus, 2000);
window.setInterval(refreshStats, 1000);
window.setInterval(refreshLogs, 3000);
</script>
</body>
</html>
